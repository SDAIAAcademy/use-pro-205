<section>
<h2>اليوم 1: اكشف الخطأ ثم افصل الخطوات</h2>
<ol>
<li><p>وصلتك مسودة خبر عن برنامج تدريبي في جهتك، ومعها جدول نتائج البرنامج. في المسودة: «تخرّج 312 متدربًا»، وهو في الجدول. ثم: «وقال أحد الخريجين: غيّر البرنامج مساري المهني.» ما الذي تفعله بالجملة الثانية؟</p><ul><li><b>أ.</b> تبقيها، فهي معقولة ولا تسيء إلى أحد</li><li><b>ب.</b> تسأل عن صاحبها وسجل موافقته، وتحذفها إن لم يوجدا</li><li><b>ج.</b> تبقيها، لأن الرقم الذي قبلها طابق الجدول</li><li><b>د.</b> تعيد صياغتها بعبارة أقوى وتنسبها إلى خريجة</li></ul></li>
<li><p>أعدّ فريقك مقطعًا ترحيبيًا لموقع الجهة: صورة حقيقية لموظفة الاستقبال، وصوتها مولّدًا بأداة من تسجيل قديم لها. وُضع على المقطع وسم «صوت مولّد بالذكاء الاصطناعي». عندكم موافقتها المسجّلة على نشر صورتها في الموقع. ما الذي ينقص؟</p><ul><li><b>أ.</b> لا شيء: المقطع موسوم وموافقة الصورة مسجّلة</li><li><b>ب.</b> وسم أكبر يبقى على الشاشة طوال المقطع</li><li><b>ج.</b> ترخيص من أداة توليد الصوت يجيز الاستخدام العام</li><li><b>د.</b> موافقتها المسجّلة على توليد صوتها لهذا المقطع</li></ul></li>
<li><p>مكتب من ثلاثة: سلمى تصوغ النشرة الشهرية مع المساعد، وفهد محرر، وهدى مديرة المكتب. أي توزيع يحفظ الفصل بين الخطوات؟</p><ul><li><b>أ.</b> سلمى تصوغ، وفهد يتحقق من الأرقام والاقتباسات ويراجع الحقوق، وهدى تعتمد بعد قراءة السجل</li><li><b>ب.</b> سلمى تصوغ اليوم وتتحقق غدًا بعين جديدة، وهدى تعتمد</li><li><b>ج.</b> سلمى تصوغ، والمساعد يتحقق في محادثة جديدة، وهدى تعتمد</li><li><b>د.</b> سلمى تصوغ، وهدى تعتمد لتلحق موعد النشر، وفهد يتحقق بعده</li></ul></li>
<li><p>فتحت مديرة المكتب سجل إصدار قبل موعد النشر بنصف ساعة. صفوف الأرقام مكتملة، وصف الحقوق مكتمل، وفي البيان اقتباسان: لأحدهما صف تحقق، وللآخر لا صف. المحرر يقول: «تحققت منه ونسيت أن أسجّل.» ما القرار؟</p><ul><li><b>أ.</b> تعتمد، فالمحرر موثوق وقد قال إنه تحقق</li><li><b>ب.</b> تعتمد الآن على أن يضاف الصف بعد النشر</li><li><b>ج.</b> يُطابق الاقتباس على سجله الآن ويُكتب صفه، ثم تعتمد</li><li><b>د.</b> تعيد هي التحقق من البيان كله قبل أن تعتمد</li></ul></li>
<li><p>في مسودة منشور كتبها المساعد: «استفاد من البرنامج قرابة 10,000 أسرة». جدول البرنامج يقول 9,340 أسرة. ماذا تسجّل؟</p><ul><li><b>أ.</b> لا شيء: التقريب مقبول في المنشورات القصيرة</li><li><b>ب.</b> خطأ أسلوب: كلمة «قرابة» ضعيفة</li><li><b>ج.</b> رقمًا تغيّر عن مصدره، ودليله صف الجدول، ويُكتب 9,340</li><li><b>د.</b> إحصائية مختلقة، ويُحذف الرقم كله</li></ul></li>
<li><p>اقتباس للمديرة العامة في بيان: جملته الأولى تطابق سجل الاقتباسات المعتمدة، وبعدها جملة ثانية ليست في السجل تعد بافتتاح عشرة فروع. ما نوع الخطأ؟</p><ul><li><b>أ.</b> لا خطأ: الجملة الأولى معتمدة والثانية في روحها</li><li><b>ب.</b> اقتباس معدَّل: يعاد إلى نصه المعتمد حرفيًا</li><li><b>ج.</b> خطأ في الأسلوب: الاقتباس أطول مما يجب</li><li><b>د.</b> إحصائية مختلقة: رقم الفروع بلا مصدر</li></ul></li>
<li><p>أي جملة في منشور تدل على أن النص يردد الموجز بدل أن يخاطب القارئ؟</p><ul><li><b>أ.</b> «سجّل الآن عبر التطبيق»</li><li><b>ب.</b> «تبدأ الخدمة يوم 10 يناير»</li><li><b>ج.</b> «الخدمة لمن بلغ 60 عامًا فأكثر»</li><li><b>د.</b> «الفئة المستهدفة: الشباب من 18 إلى 35، والنبرة حماسية»</li></ul></li>
<li><p>صورة جميلة لمتطوعين مع تعليق «من فعالية الأسبوع الماضي». سجل الأصول يقول: ولّدها المصمم بأداة توليد. أي قاعدتين تسمّيهما في سجل الأخطاء؟</p><ul><li><b>أ.</b> الوسم الناقص، وتعليق يدّعي حدثًا لم تُلتقط فيه الصورة</li><li><b>ب.</b> الترخيص، والنسبة إلى المصوّر</li><li><b>ج.</b> الموافقة على الصورة، وسحب الموافقة</li><li><b>د.</b> لا قاعدة: الصورة لا تسيء إلى أحد</li></ul></li>
<li><p>محرر يصوغ النشرة مع المساعد صباحًا، ثم «يراجعها بعين جديدة» بعد الغداء، ثم يرسلها إلى المديرة للاعتماد. ما الخلل في المسار؟</p><ul><li><b>أ.</b> المراجعة يجب أن تكون في اليوم التالي لا بعد الغداء</li><li><b>ب.</b> المديرة يجب أن تعيد التحقق من كل رقم</li><li><b>ج.</b> لا خلل: فيه صياغة ومراجعة واعتماد</li><li><b>د.</b> المتحقق هو الصائغ: الخطوتان لشخص واحد</li></ul></li>
<li><p>في بطاقة مسار العمل كتب زميل أمام خطوة التحقق من الحقائق: «وضع الذكاء الاصطناعي: كامل، المساعد يطابق الأرقام». ما التعليق الأنفع؟</p><ul><li><b>أ.</b> المحاولة الأولى دون مساعد، ثم المساعد فاحصًا ثانيًا يُتحقق من ادعاءاته</li><li><b>ب.</b> يُكتب «معلِّم» لأن المساعد يشرح الأرقام</li><li><b>ج.</b> مقبول إن كان المساعد معتمدًا في الجهة</li><li><b>د.</b> يُمنع المساعد من المسار كله</li></ul></li>
<li><p>أي صف في سجل المحتوى يثبت أن التحقق من الأرقام وقع؟</p><ul><li><b>أ.</b> «راجعت البيان كاملًا، لا ملاحظات»</li><li><b>ب.</b> «المساعد أكد صحة الأرقام»</li><li><b>ج.</b> «أرقام البيان على الجدول 1: 3,500 صُحّحت إلى 3,150»</li><li><b>د.</b> «الأرقام مأخوذة من التقرير»</li></ul></li>
<li><p>قبل النشر بساعة، في السجل صورة مولّدة لها صف صياغة ولا صف حقوق لها. بقية الصفوف مكتملة. ما قرار صاحبة الاعتماد؟</p><ul><li><b>أ.</b> تعتمد النص وتؤجل الصورة إلى ما بعد النشر</li><li><b>ب.</b> لا تعتمد حتى يُكتب صف الحقوق وفيه الوسم، أو تُرفع الصورة من الإصدار</li><li><b>ج.</b> تعتمد: الصورة رسم ولا أشخاص حقيقيين فيها</li><li><b>د.</b> تضيف الوسم بنفسها وتعتمد</li></ul></li>
<li><p>لماذا تقيس بطاقة إعادة التصميم ثلاثة أرقام لا الوقت وحده؟</p><ul><li><b>أ.</b> لأن الوقت صعب القياس بدقة</li><li><b>ب.</b> لأن إصدارًا أسرع بتصحيحات بعد النشر ليس أفضل: الأرقام تُقرأ معًا</li><li><b>ج.</b> لأن ثلاثة أرقام تبدو أقنع أمام الإدارة</li><li><b>د.</b> لأن الأخطاء تقل دائمًا حين يُستخدم المساعد</li></ul></li>
<li><p>خط الأساس: بيان صحفي أخذ 90 دقيقة دون تسجيل للتحقق. التنفيذ الأول بالمساعد: ثلاثة منشورات قصيرة في 35 دقيقة. يكتب المشارك: «وفّرت 61% من الوقت». ما الخلل؟</p><ul><li><b>أ.</b> النسبة محسوبة خطأ</li><li><b>ب.</b> يجب أن يكون التنفيذ الأول أبطأ دائمًا</li><li><b>ج.</b> المهمتان مختلفتان، والدقائق لا تُعدّ بالطريقة نفسها</li><li><b>د.</b> 35 دقيقة أقل من أن تُصدَّق</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: نسختان بحقائق واحدة ووسائط معروفة المنشأ</h2>
<ol>
<li><p>سجل إصدار فيه ثلاثة صفوف: «الصياغة: سارة مع المساعد»، ثم «التحقق: سارة، راجعت الأرقام والاقتباسات، لا ملاحظات»، ثم «الاعتماد: مدير الإدارة». في الإصدار صورة ولّدها المصمم. ما أهم نقص؟</p><ul><li><b>أ.</b> لا دقائق في الصفوف</li><li><b>ب.</b> صف الصياغة لا يذكر الأمر الذي كُتب للمساعد</li><li><b>ج.</b> المتحققة هي الصائغة، ولا صف حقوق للصورة المولّدة</li><li><b>د.</b> الاعتماد لم يُسجَّل فيه وضع الذكاء الاصطناعي</li></ul></li>
<li><p>اعتُمدت اليوم نشرة عربية عن نتائج برنامج، وفيها أحد عشر رقمًا وأربعة أسماء واقتباس. المطلوب نسخة إنجليزية غدًا، وعندك مساعد معتمد ومسرد. ما أول ما تفعله؟</p><ul><li><b>أ.</b> تستخرج من النشرة المعتمدة ورقة حقائق، وتثبّت فيها المقابل الإنجليزي من المسرد</li><li><b>ب.</b> تلصق النشرة في المساعد وتطلب ترجمة دقيقة</li><li><b>ج.</b> تكتب أمرًا مفصلًا يطلب من المساعد ألا يغيّر أي رقم</li><li><b>د.</b> تجمع الأرقام من موجز البرنامج الأصلي</li></ul></li>
<li><p>قارنتَ إعلانًا عربيًا بنسخته الإنجليزية ووجدت أربعة فروق. أيها يجب تصحيحه قبل النشر؟</p><ul><li><b>أ.</b> النسخة الإنجليزية أقصر: حُذفت منها جملة الترحيب</li><li><b>ب.</b> الفقرة الثانية والثالثة تبادلتا موضعيهما</li><li><b>ج.</b> جملة مبنية للمجهول صارت مبنية للمعلوم</li><li><b>د.</b> «يُغلق التسجيل يوم 5 مارس» صارت «registration closes on 3 May»</li></ul></li>
<li><p>جدول برنامج تدريبي: سجّل 800 متدرب، أكمل منهم 600، وأُرسل استطلاع إلى من أكملوا فأجاب 300، وقال 270 منهم إن البرنامج أفادهم في عملهم. أي جملة تُنشر كما هي؟</p><ul><li><b>أ.</b> «90% من المتدربين أفادهم البرنامج في عملهم»</li><li><b>ب.</b> «أكمل البرنامج 600 من 800 متدرب، أي 75%»</li><li><b>ج.</b> «أقل من نصف من أكملوا البرنامج استفادوا منه»</li><li><b>د.</b> «الأغلبية الساحقة من المتدربين راضون تمامًا»</li></ul></li>
<li><p>وصلتك من فرع صورة لموظف يسلّم شهادة إلى متدربة. لا بيانات اعتماد فيها، والبحث العكسي بلا نتائج. يقول من أرسلها: «التقطتُها بهاتفي أمس.» في سجل الموافقات موافقة الموظف على مواد الجهة العامة، ولا صف للمتدربة. ما القرار؟</p><ul><li><b>أ.</b> رفض: لا بيانات اعتماد، فقد تكون مولّدة</li><li><b>ب.</b> نشر: المصوّر معروف، والبحث العكسي نظيف</li><li><b>ج.</b> إيقاف حتى تُسجَّل موافقة المتدربة لهذا الغرض، ثم نشر بلا وسم</li><li><b>د.</b> نشر بوسم يذكر أن الصورة من هاتف موظف</li></ul></li>
<li><p>نشرة شهرية: في خط الأساس 90 دقيقة، ولا خطأ مكتشف قبل الاعتماد، وتصحيحان بعده. في التنفيذ الثاني 110 دقائق، منها 35 للتحقق والحقوق، وأربعة أخطاء مكتشفة قبل الاعتماد، ولا تصحيح بعده. ما الاستنتاج الذي يُكتب في البطاقة؟</p><ul><li><b>أ.</b> إعادة التصميم لم تنجح: الوقت زاد عشرين دقيقة</li><li><b>ب.</b> الأخطاء انتقلت من بعد الاعتماد إلى قبله بعشرين دقيقة إضافية، ذهبت إلى التحقق والحقوق كما يقول السجل</li><li><b>ج.</b> يُلغى المساعد في الصياغة، لأنه أبطأ العمل</li><li><b>د.</b> يُذكر التنفيذ الأول وحده إن كان أسرع من الثاني</li></ul></li>
<li><p>لماذا تُستخرج ورقة الحقائق من النص المعتمد قبل صياغة النسخة باللغة الثانية؟</p><ul><li><b>أ.</b> لأن المساعد لا يترجم دون جدول</li><li><b>ب.</b> لأنها تختصر النص فتقصر الترجمة</li><li><b>ج.</b> لأنها تغني عن مراجعة النسخة الثانية</li><li><b>د.</b> لأنها تحدد مسبقًا ما يجب أن يتطابق، فيُفحص عليه سطرًا سطرًا</li></ul></li>
<li><p>النسخة العربية تقول «10 يناير 2027»، والمسودة الإنجليزية تقول «1 October 2027». ما أرجح تفسير، وما الوقاية؟</p><ul><li><b>أ.</b> المساعد أخطأ في الحساب: يُطلب منه إعادة المحاولة</li><li><b>ب.</b> المترجم غيّر الموعد عمدًا للسوق الأجنبية</li><li><b>ج.</b> قُرئ تاريخ مكتوب أرقامًا بترتيب الشهر ثم اليوم: يُكتب الشهر باسمه في المصدر وورقة الحقائق</li><li><b>د.</b> الفرق في التقويم الهجري والميلادي</li></ul></li>
<li><p>في فحص التطابق يُستخدم المساعد «معلِّمًا». أي أمر يحفظ هذا الوضع؟</p><ul><li><b>أ.</b> «قارن النسختين وصحّح الإنجليزية»</li><li><b>ب.</b> «اسألني عن أنواع الحقائق التي سأقارنها، ونبّهني إلى نوع نسيته. لا تذكر الفروق ولا تصحح»</li><li><b>ج.</b> «اكتب لي قائمة بكل الفروق بين النسختين»</li><li><b>د.</b> «هل النسختان متطابقتان؟ أجب بنعم أو لا»</li></ul></li>
<li><p>بين منشور عربي ونسخته الإنجليزية أربعة فروق. أيها فرق حقيقة يجب تصحيحه، لا فرق أسلوب؟</p><ul><li><b>أ.</b> الإنجليزية أقصر بجملة تحية</li><li><b>ب.</b> الإنجليزية تنتهي بعلامة تعجب</li><li><b>ج.</b> ترتيب الجملتين مختلف</li><li><b>د.</b> «وسيط المدة 26 ساعة» صارت «average time of 26 hours»</li></ul></li>
<li><p>استطلاع أُرسل إلى 2,000 مشترك وأجاب عنه 400، وقال 360 منهم إنهم راضون. أي جملة يسندها المصدر؟</p><ul><li><b>أ.</b> «90% من المشتركين راضون»</li><li><b>ب.</b> «18% فقط من المشتركين راضون»</li><li><b>ج.</b> «90% ممن أجابوا عن الاستطلاع، وعددهم 400، راضون»</li><li><b>د.</b> «أغلب المشتركين راضون جدًّا»</li></ul></li>
<li><p>جملة في ورقة الأسئلة والأجوبة تستشهد بصحيفة: «24% من البالغين يتطوعون». الصحيفة تنقل عن مسح للجهة نفسها. ما الخطوة التالية؟</p><ul><li><b>أ.</b> تُنشر: الصحيفة مصدر منشور ومعروف</li><li><b>ب.</b> يُفتح المسح نفسه، ويُقرأ السؤال الذي سُئل والعدد الذي أجاب</li><li><b>ج.</b> يُسأل المساعد: هل الرقم صحيح؟</li><li><b>د.</b> يُحذف الرقم لأنه من صحيفة</li></ul></li>
<li><p>صورة وصلت عبر تطبيق مراسلة، لا بيانات اعتماد محتوى فيها ولا علامة مائية. ماذا يثبت ذلك؟</p><ul><li><b>أ.</b> أنها حقيقية: الصور المولّدة تحمل دائمًا بيانات اعتماد</li><li><b>ب.</b> أنها مولّدة: الكاميرات الحديثة توقّع صورها</li><li><b>ج.</b> لا شيء عن منشئها: يُبحث عنها بحثًا عكسيًا ويُسأل من أرسلها عن أصلها</li><li><b>د.</b> أنها عُدّلت: حذف البيانات أثر تعديل</li></ul></li>
<li><p>صورة حقيقية لمتطوعة، بيانات اعتمادها موقّعة، وفي سجل الموافقات موافقتها لغرض «التقرير السنوي الداخلي». تريدون الصورة لحملة في وسائل التواصل. ما القرار؟</p><ul><li><b>أ.</b> نشر: الصورة حقيقية ومنشؤها ثابت</li><li><b>ب.</b> نشر بوسم «بموافقة صاحبتها»</li><li><b>ج.</b> رفض نهائي: لا تُستخدم الصورة أبدًا</li><li><b>د.</b> إيقاف حتى تُطلب موافقة جديدة لغرض الحملة العامة</li></ul></li>
<li><p>في التنفيذ الثاني وصل بعد الاعتماد تصحيح: اسم مسؤول كُتب في النسخة الإنجليزية بغير كتابة المسرد. ماذا يدخل بطاقة إعادة التصميم؟</p><ul><li><b>أ.</b> لا شيء: التصحيح صغير ولم يلحظه أحد</li><li><b>ب.</b> تُحذف النسخة الإنجليزية من المهمة</li><li><b>ج.</b> يُطلب من المساعد أن يكون أدق في الأسماء</li><li><b>د.</b> تصحيح واحد بعد الاعتماد، وخطوة فحص تطابق على ورقة الحقائق قبل الاعتماد</li></ul></li>
<li><p>في المراجعة المباشرة يختار المقيِّم اقتباسًا من إصدارك ويطلب أن تعيد التحقق منه. ما الذي يدل على أن مسارك يعمل؟</p><ul><li><b>أ.</b> تفتح صف الاقتباس في سجلك، ثم مصدره، وتشير إلى النص المعتمد في أقل من دقيقتين</li><li><b>ب.</b> تتذكر من قال الاقتباس ومتى</li><li><b>ج.</b> تسأل المساعد عن مصدر الاقتباس</li><li><b>د.</b> تشرح أن فريقك يتحقق دائمًا من الاقتباسات</li></ul></li>
</ol>
